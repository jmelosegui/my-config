# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2.0
# WinGet DSC Configuration File
#
# Each package is pinned to a specific version. To change a target version,
# first confirm it exists in the winget source:
#   winget show <id> --versions
# Removing the `version:` line reverts that package to "install if not present"
# (latest at first install, no auto-upgrade thereafter).

properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Neovim
      directives:
        description: Installing Neovim
        allowPrerelease: true
      settings:
        id: Neovim.Neovim
        version: "0.12.4"
        source: winget
        Ensure: Present
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Zed
      directives:
        description: Installing Zed
        allowPrerelease: true
      settings:
        id: ZedIndustries.Zed
        version: "1.14.2"
        source: winget
        Ensure: Present
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: FilePilot
      directives:
        description: Installing File Pilot
        allowPrerelease: true
      settings:
        id: Voidstar.FilePilot
        version: "0.8.2"
        source: winget
        Ensure: Present
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: VSCode
      directives:
        description: Installing Visual Studio Code
        allowPrerelease: true
      settings:
        id: Microsoft.VisualStudioCode
        version: "1.126.0"
        source: winget
        Ensure: Present
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: OhMyPosh
      directives:
        description: Installing Oh My Posh
        allowPrerelease: true
      settings:
        id: JanDeDobbeleer.OhMyPosh
        version: "30.6.2"
        source: winget
        Ensure: Present
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Fastfetch
      directives:
        description: Installing Fastfetch
        allowPrerelease: true
      settings:
        id: Fastfetch-cli.Fastfetch
        version: "2.66.0"
        source: winget
        Ensure: Present
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: ripgrep
      directives:
        description: Installing ripgrep
        allowPrerelease: true
      settings:
        id: BurntSushi.ripgrep.MSVC
        version: "15.2.0"
        source: winget
        Ensure: Present
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: lazygit
      directives:
        description: Installing lazygit
        allowPrerelease: true
      settings:
        id: JesseDuffield.lazygit
        version: "0.63.1"
        source: winget
        Ensure: Present
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: Ubuntu-22.04
      directives:
